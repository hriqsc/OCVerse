[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
actix-multipart = "0.8.0"
actix-files = "0.6"
actix-cors = "0.7"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
sqlx = {version =  "0.9.0", features = ["sqlite","macros","chrono"] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
thiserror = "2"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22.1"
chrono = "0.4.45"
jsonwebtoken = "11.0.0"
sha2 = "0.11.0"
futures-util = "0.3.33"
uuid = { version = "1.24.0", features = ["v4"] }
anyhow = "1.0.103"
